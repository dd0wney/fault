# golangci-lint configuration, schema version 2 (the installed linter is
# v2.x, and v2 accepts only this schema).
#
# `default: standard` gives errcheck, govet, ineffassign, staticcheck, and
# unused. This library's subject is the unhandled error, so errcheck is the
# one linter here that is not negotiable, and the two settings below widen
# what it catches:
#
#   check-blank:            an error assigned to `_` is still an unhandled
#                            error, and the default leaves it unreported.
#   check-type-assertions:  the two-value form of a type assertion returns an
#                            `ok` that is the same shape as an error return,
#                            and a caller that drops it has the same bug.
#
# errorlint is enabled for the same reason: it catches the two ways that
# wrapping breaks errors.Is/errors.As (a %s where %w belongs, and a raw ==
# comparison against a sentinel), which is a second, common way an error
# stops being handled correctly even though a return value is checked.
#
# gosec is deliberately NOT enabled. See the comment beside the `govulncheck`
# step in the `checks` job of this file for the reason: its one finding on
# this module is a false positive.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
