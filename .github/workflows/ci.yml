name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }} go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.23 is the module's floor, and a floor nothing tests is a guess.
        # stable catches what a new toolchain changes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - run: go build ./...
      - run: go vet ./...

      # -count=1 defeats the test cache. A cached pass is a claim about an
      # earlier run, not this one.
      - run: go test -count=1 ./...

      # The race detector on Windows needs a C toolchain, and the module has no
      # Windows-specific concurrency. Linux and macOS cover the mutex.
      - name: race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      # A skip is a gap, not a pass, and a platform-skipped assertion is the
      # quiet kind: the job is green and the thing was never executed there.
      # The graphdb session found the sharper form of this in its own tree -- a
      # build-tag-gated file that compiles everywhere CI runs and is executed
      # nowhere. Printing the count per matrix leg makes the asymmetry visible.
      - name: report skipped tests
        shell: bash
        run: |
          skipped="$(go test -v ./... 2>&1 | grep -c '^ *--- SKIP' || true)"
          echo "${{ matrix.os }} go${{ matrix.go }}: $skipped test(s) skipped"
          go test -v ./... 2>&1 | grep '^ *--- SKIP' || true

  checks:
    name: format and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      # The selftest runs FIRST, on purpose. A gate that cannot report a
      # violation and a gate with nothing to report print the same thing, so the
      # gate proves it works before its result is believed.
      - name: the dependency gate can report a violation
        run: ./scripts/no-external-deps-selftest.sh

      - name: no dependency outside the standard library
        run: ./scripts/no-external-deps.sh

      # Trivially clean while the module has zero dependencies, which is the
      # point: it costs one job now and starts earning the moment that changes.
      #
      # gosec is deliberately NOT here. Its only finding on this module is a
      # false positive -- G304 at fs/os.go, where opening a caller-supplied path
      # is the function's entire purpose -- so adopting it would mean suppressing
      # the sole thing it says, and the suppression is what people learn.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  tools:
    name: tools module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # tools/ is a separate module at go 1.24, so the library keeps its
          # 1.23 floor while the gates can use tool directives.
          go-version: stable
      - working-directory: tools
        run: |
          # -o a directory, because a bare `go build ./...` would try to write a
          # binary named "coupling" beside the package directory of that name.
          go build -o "$(mktemp -d)" ./...
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...

      # A skip is a gap, not a pass. The count is printed so an unwritten
      # function stays visible in the log rather than hiding behind a green
      # tick, and so a skip that should have become a real test gets noticed.
      - name: report skipped tests
        working-directory: tools
        run: |
          skipped="$(go test -v ./... 2>&1 | grep -c '^ *--- SKIP' || true)"
          echo "tools: $skipped test(s) skipped"

      # The coupling gate, run against this module's own registry. Statement
      # and branch coverage measure what happened INSIDE a component; this
      # measures the interfaces between them, which is DO-178C objective
      # 6.4.4.d and the thing nine of graphdb's thirteen defects were.
      #
      # There is no threshold. A floor set before the number is understood is
      # how a coverage gate gets set wrong. Exit 1 means a declared interface
      # was never exercised at all; exit 2 means the measure could not run.
      - name: coupling coverage
        run: |
          go test -coverprofile=coverage.out ./... > /dev/null
          go -C tools build -o "$RUNNER_TEMP/coupling" ./coupling
          "$RUNNER_TEMP/coupling" -root . -registry docs/couplings.tsv -profile coverage.out

      # tools/ carries its own mutation baseline (tools/mutation-baseline.tsv),
      # read by the same scripts/mutation.sh the library uses, pointed at the
      # tools module with --root and --baseline. See that file's header for
      # what the recorded floor covers.
      - name: install go-mutesting
        run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest

      # The selftest runs first, same reason as the mutation job below: a
      # gate that cannot report a violation and a gate with nothing to
      # report print the same thing.
      - name: the mutation gate can report a violation
        run: ./scripts/mutation-selftest.sh

      - name: tools mutation score against the recorded floor
        run: ./scripts/mutation.sh --root tools --baseline tools/mutation-baseline.tsv

  mutation:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install go-mutesting
        # Two earlier claims in this repository's history were wrong, and this
        # is the third and last statement on it.
        #
        #   "gremlins is broken on Go 1.27"          -- no. It works elsewhere.
        #   "gremlins fails on a ./-prefixed target" -- no. ./pkg/x/y/ works
        #                                               elsewhere, same shape.
        #
        # What is actually known: in THIS module, every gremlins invocation
        # tried reported nothing, and unprefixed targets later worked. The
        # variable was never isolated, so the cause is unknown.
        #
        # go-mutesting is kept on the one comparison that holds: on the same
        # packages it produces 17 mutants each where gremlins produces 2 and 3.
        #
        # The durable lesson is about both tools. A mutation run that reports
        # nothing looks exactly like a codebase with nothing to find, and
        # neither tool distinguishes them. That is why the selftest exists.
        run: go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest

      # The selftest runs first. A gate that cannot report a violation and a
      # gate with nothing to report print the same thing.
      - name: the mutation gate can report a violation
        run: ./scripts/mutation-selftest.sh

      - name: mutation score against the recorded floors
        run: ./scripts/mutation.sh

  # golangci-lint cannot run on this machine as of this commit. The local
  # binary is v2.12.2, built with go1.26.3, and the local `go` is 1.27.0. It
  # stops with a typecheck error in the standard library before it reads a
  # single file of this repository:
  #
  #   internal/poll/splice_linux.go:237:21: unknown field rfd in struct
  #   literal of type splicePipe (typecheck)
  #
  # The action below downloads its own pinned golangci-lint release and runs
  # it against the Go toolchain this job selects, so the failure above is a
  # property of this machine, not of the gate. A person who runs the linter
  # here and sees this failure must read this comment, not assume the gate
  # is broken.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The selftest runs first, on purpose, matching every other gate in
      # this file: a gate that cannot report a violation and a gate with
      # nothing to report print the same thing. scripts/testdata/lintfixture
      # is a separate Go module, so it stays out of go build/vet/list for
      # the library, and it holds one deliberate violation: an unchecked
      # error return, which errcheck (in the default linter set) must
      # reject.
      - name: the lint gate can report a violation
        id: lintfixture
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          working-directory: scripts/testdata/lintfixture

      # continue-on-error above turns a lint failure into a green step with
      # outcome "failure", so the result has to be asserted here rather than
      # assumed from the step's own color.
      - name: assert the lint selftest actually failed
        env:
          OUTCOME: ${{ steps.lintfixture.outcome }}
        run: |
          outcome="$OUTCOME"
          if [ "$outcome" != "failure" ]; then
            echo "lint selftest: expected the fixture to fail, got outcome '$outcome'" >&2
            exit 1
          fi
          echo "lint selftest: the fixture's violation was correctly rejected"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
